<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Paper Translator & Summarizer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1E1E1E',
                        borderColor: '#2E2E2E',
                        textPrimary: '#E4E4E7',
                        textSecondary: '#A1A1AA',
                        accent: '#3B82F6',
                    }
                }
            }
        }
    </script>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

    <!-- KaTeX CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #E4E4E7;
            font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, sans-serif;
        }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2E2E2E;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3F3F46;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-darkBg text-textPrimary selection:bg-accent selection:text-white">

    <!-- Sticky Top Control Bar -->
    <header class="sticky top-0 z-50 bg-[#1E1E1E]/90 backdrop-blur-md border-b border-borderColor px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- App Title & Status Indicator -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-accent animate-pulse" id="status-dot"></div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                        Academic Paper Translator
                    </h1>
                </div>
                <span id="status-badge" class="text-xs px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400 border border-borderColor">
                    就緒
                </span>
            </div>

            <!-- Configuration & Actions -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <!-- API Key Input -->
                <div class="relative flex items-center">
                    <input type="password" id="api-key-input" placeholder="Gemini API Key" 
                        class="bg-[#121212] border border-borderColor text-xs rounded-lg px-3 py-2 text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-accent w-44 md:w-56 transition-all">
                    <button type="button" id="toggle-key-visibility" class="absolute right-2.5 text-zinc-400 hover:text-zinc-200 text-xs">
                        👁️
                    </button>
                </div>

                <!-- Model Selector -->
                <select id="model-select" class="bg-[#121212] border border-borderColor text-xs rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-accent transition-all">
                    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                </select>

                <!-- Compact PDF Upload Button -->
                <label class="cursor-pointer bg-accent hover:bg-blue-600 text-white text-xs font-medium px-4 py-2 rounded-lg shadow transition-all flex items-center gap-2">
                    <span>📂 上傳 PDF</span>
                    <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- Error / Alert Banner -->
        <div id="error-banner" class="hidden bg-red-950/40 border border-red-800/60 text-red-300 px-4 py-3 rounded-xl text-sm flex items-center justify-between shadow-lg">
            <span id="error-message"></span>
            <button onclick="hideError()" class="text-red-400 hover:text-red-200 font-bold ml-4">&times;</button>
        </div>

        <!-- Progress & Status Banner (Hidden by default) -->
        <div id="progress-container" class="hidden bg-cardBorder bg-[#1E1E1E] border border-borderColor rounded-2xl p-5 shadow-xl flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
                    <span id="progress-text" class="text-sm font-medium text-zinc-200">正在處理 PDF...</span>
                </div>
                <button id="cancel-btn" class="bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-800/50 text-xs px-3 py-1.5 rounded-lg transition-all font-medium">
                    取消處理
                </button>
            </div>
            <div class="w-full bg-[#121212] rounded-full h-2 overflow-hidden border border-borderColor">
                <div id="progress-bar" class="bg-accent h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Empty / Upload State (Visible initially) -->
        <div id="upload-state-card" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-borderColor rounded-3xl p-12 text-center bg-[#1E1E1E]/40 hover:bg-[#1E1E1E]/80 transition-all cursor-pointer group my-auto min-h-[50vh]">
            <input type="file" id="dropzone-file-input" accept="application/pdf" class="hidden">
            <div class="w-16 h-16 rounded-2xl bg-accent/10 border border-accent/20 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform text-accent text-2xl">
                📄
            </div>
            <h2 class="text-xl font-semibold text-zinc-200 mb-2">拖放學術論文 PDF 至此，或點擊上傳</h2>
            <p class="text-sm text-zinc-400 max-w-md mx-auto mb-6">
                支援自動擷取內文、結構化解析 5 大重點，並提供即時中英雙語對照學術翻譯與 LaTeX 數學公式渲染。
            </p>
            <span class="bg-accent text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-lg group-hover:bg-blue-600 transition-all">
                選擇 PDF 檔案
            </span>
        </div>

        <!-- Main Workspace (Split-View / Responsive Two-Column Layout) - Hidden initially -->
        <div id="workspace-container" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
            
            <!-- Left Panel: Structured Summary (35% width -> 4 cols on lg) -->
            <section class="lg:col-span-4 bg-[#1E1E1E] border border-borderColor rounded-2xl p-5 shadow-xl sticky top-20 flex flex-col max-h-[calc(100vh-6rem)]">
                <div class="flex items-center justify-between pb-3 border-b border-borderColor mb-4">
                    <h3 class="font-bold text-sm tracking-wide text-zinc-200 uppercase flex items-center gap-2">
                        <span>📑</span> 論文重點整理 (Structured Summary)
                    </h3>
                </div>
                <div id="summary-content" class="overflow-y-auto pr-1 space-y-4 text-sm text-zinc-300 leading-relaxed">
                    <!-- Dynamic Summary Render -->
                </div>
            </section>

            <!-- Right Panel: Full Translation Reader (65% width -> 8 cols on lg) -->
            <section class="lg:col-span-8 bg-[#1E1E1E] border border-borderColor rounded-2xl p-5 shadow-xl flex flex-col min-h-[calc(100vh-6rem)]">
                
                <!-- View Mode Header Switcher -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-4 border-b border-borderColor gap-3 mb-5">
                    <h3 class="font-bold text-sm tracking-wide text-zinc-200 uppercase flex items-center gap-2">
                        <span>🌐</span> 全文學術翻譯 (Full Translation)
                    </h3>
                    
                    <!-- View Mode Toggle Switch -->
                    <div class="bg-[#121212] p-1 rounded-xl border border-borderColor flex items-center text-xs">
                        <button id="mode-mono-btn" onclick="switchViewMode('mono')" class="px-3 py-1.5 rounded-lg font-medium transition-all bg-accent text-white shadow">
                            純繁中閱讀
                        </button>
                        <button id="mode-bi-btn" onclick="switchViewMode('bilingual')" class="px-3 py-1.5 rounded-lg font-medium transition-all text-zinc-400 hover:text-zinc-200">
                            中英雙語對照
                        </button>
                    </div>
                </div>

                <!-- Translation Stream Container -->
                <div id="translation-container" class="flex-1 overflow-y-auto space-y-6 pr-2 text-sm text-zinc-300 leading-relaxed">
                    <!-- Dynamic Translation Chunks -->
                </div>
            </section>

        </div>

    </main>

    <!-- Application Logic Script -->
    <script>
        // State management
        let state = {
            apiKey: localStorage.getItem('gemini_api_key') || '',
            model: localStorage.getItem('gemini_model') || 'gemini-2.5-flash',
            viewMode: 'mono', // 'mono' or 'bilingual'
            isProcessing: false,
            abortController: null,
            extractedChunks: [],
            translationResults: [] // { original, translation }
        };

        // DOM Elements
        const apiKeyInput = document.getElementById('api-key-input');
        const toggleKeyBtn = document.getElementById('toggle-key-visibility');
        const modelSelect = document.getElementById('model-select');
        const pdfFileInput = document.getElementById('pdf-file-input');
        const dropzoneFileInput = document.getElementById('dropzone-file-input');
        const uploadStateCard = document.getElementById('upload-state-card');
        const workspaceContainer = document.getElementById('workspace-container');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorBanner = document.getElementById('error-banner');
        const errorMessage = document.getElementById('error-message');
        const summaryContent = document.getElementById('summary-content');
        const translationContainer = document.getElementById('translation-container');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const modeMonoBtn = document.getElementById('mode-mono-btn');
        const modeBiBtn = document.getElementById('mode-bi-btn');

        // Initialize UI from LocalStorage
        if (state.apiKey) apiKeyInput.value = state.apiKey;
        if (state.model) modelSelect.value = state.model;

        // Event Listeners for Config persistence
        apiKeyInput.addEventListener('input', (e) => {
            state.apiKey = e.target.value.trim();
            localStorage.setItem('gemini_api_key', state.apiKey);
        });

        modelSelect.addEventListener('change', (e) => {
            state.model = e.target.value;
            localStorage.setItem('gemini_model', state.model);
        });

        // Toggle API Key visibility
        toggleKeyBtn.addEventListener('click', () => {
            apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
        });

        // Error handling helper
        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.classList.remove('hidden');
        }
        function hideError() {
            errorBanner.classList.add('hidden');
        }

        // Status updater
        function setStatus(text, badgeText, isBusy = false) {
            progressText.textContent = text;
            statusBadge.textContent = badgeText;
            if (isBusy) {
                statusDot.classList.remove('bg-accent', 'bg-emerald-500');
                statusDot.classList.add('bg-amber-500', 'animate-ping');
            } else {
                statusDot.classList.remove('bg-amber-500', 'animate-ping');
                statusDot.classList.add('bg-emerald-500');
            }
        }

        // File upload triggers
        uploadStateCard.addEventListener('click', () => dropzoneFileInput.click());
        dropzoneFileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));
        pdfFileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        // Drag and drop support
        uploadStateCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadStateCard.classList.add('border-accent', 'bg-[#1E1E1E]');
        });
        uploadStateCard.addEventListener('dragleave', () => {
            uploadStateCard.classList.remove('border-accent', 'bg-[#1E1E1E]');
        });
        uploadStateCard.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadStateCard.classList.remove('border-accent', 'bg-[#1E1E1E]');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        // Cancel processing
        cancelBtn.addEventListener('click', () => {
            if (state.abortController) {
                state.abortController.abort();
                state.abortController = null;
            }
            state.isProcessing = false;
            progressContainer.classList.add('hidden');
            setStatus('已取消處理', '已中止', false);
        });

        // View Mode Toggling
        function switchViewMode(mode) {
            state.viewMode = mode;
            if (mode === 'mono') {
                modeMonoBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all bg-accent text-white shadow';
                modeBiBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all text-zinc-400 hover:text-zinc-200';
            } else {
                modeBiBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all bg-accent text-white shadow';
                modeMonoBtn.className = 'px-3 py-1.5 rounded-lg font-medium transition-all text-zinc-400 hover:text-zinc-200';
            }
            renderTranslationUI();
        }

        // Step 1: PDF Text Extraction & Cleaning Pipeline
        async function handleFileSelect(file) {
            if (!file || file.type !== 'application/pdf') {
                showError('請上傳有效的 PDF 檔案。');
                return;
            }
            if (!state.apiKey) {
                showError('請先輸入您的 Gemini API Key 才能開始處理論文。');
                apiKeyInput.focus();
                return;
            }

            hideError();
            state.isProcessing = true;
            state.abortController = new AbortController();

            // Reset UI
            uploadStateCard.classList.add('hidden');
            workspaceContainer.classList.remove('hidden');
            progressContainer.classList.remove('hidden');
            summaryContent.innerHTML = '';
            translationContainer.innerHTML = '';
            progressBar.style.width = '5%';
            setStatus('正在讀取 PDF 檔案...', '解析中', true);

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                let rawTextPages = [];
                for (let i = 1; i <= numPages; i++) {
                    if (state.abortController.signal.aborted) throw new Error('使用者已取消');
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    rawTextPages.push(pageText);
                    
                    const pct = Math.round((i / numPages) * 20);
                    progressBar.style.width = `${pct}%`;
                    setStatus(`正在擷取第 ${i} / ${numPages} 頁文字...`, '解析中', true);
                }

                const fullRawText = rawTextPages.join('\n');
                
                // Scanned PDF detection check
                if (!fullRawText || fullRawText.trim().length < 100) {
                    throw new Error('此 PDF 檔案無法擷取足夠文字（可能是掃描圖片型 PDF，缺乏文字圖層）。');
                }

                setStatus('正在進行文字清理與段落重構...', '清理中', true);
                progressBar.style.width = '25%';

                // Cleaning pipeline: de-hyphenation & paragraph reconstruction
                const cleanedText = cleanPdfText(fullRawText);

                // Step 2: Intelligent Text Chunking (~2500 - 3500 chars per chunk on paragraph boundaries)
                state.extractedChunks = chunkTextByParagraphs(cleanedText, 3000);

                if (state.extractedChunks.length === 0) {
                    throw new Error('未能成功分割出有效段落文字。');
                }

                // Step 3A: Generate Executive Summary
                await generateExecutiveSummary(cleanedText);

                // Step 3B: Sequential Full Translation Pipeline
                await processFullTranslation();

            } catch (err) {
                if (err.message !== '使用者已取消') {
                    showError(`發生錯誤: ${err.message}`);
                    uploadStateCard.classList.remove('hidden');
                    workspaceContainer.classList.add('hidden');
                }
                progressContainer.classList.add('hidden');
                state.isProcessing = false;
            }
        }

        function cleanPdfText(text) {
            // 1. De-hyphenation across line breaks (e.g. algo-\nrithm -> algorithm)
            let cleaned = text.replace(/([a-zA-Z]+)-\s*\n\s*([a-zA-Z]+)/g, '$1$2');
            
            // 2. Normalize multiple newlines into paragraphs, strip single line breaks within sentences
            // Split into lines first
            const lines = cleaned.split(/\r?\n/);
            let paragraphs = [];
            let currentPara = [];

            for (let line of lines) {
                const trimmed = line.trim();
                if (trimmed === '') {
                    if (currentPara.length > 0) {
                        paragraphs.push(currentPara.join(' '));
                        currentPara = [];
                    }
                } else {
                    // Filter out isolated short headers/footers or page numbers if necessary
                    currentPara.push(trimmed);
                }
            }
            if (currentPara.length > 0) {
                paragraphs.push(currentPara.join(' '));
            }

            return paragraphs.join('\n\n');
        }

        function chunkTextByParagraphs(text, targetSize = 3000) {
            const paragraphs = text.split(/\n\s*\n/);
            let chunks = [];
            let currentChunk = '';

            for (let para of paragraphs) {
                if ((currentChunk.length + para.length) > targetSize && currentChunk.length > 0) {
                    chunks.push(currentChunk.trim());
                    currentChunk = para;
                } else {
                    currentChunk += (currentChunk ? '\n\n' : '') + para;
                }
            }
            if (currentChunk.trim().length > 0) {
                chunks.push(currentChunk.trim());
            }
            return chunks;
        }

        // API Call Helper with Exponential Backoff
        async function callGeminiAPI(systemInstruction, userContent, retries = 2, delay = 1000) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`;
            
            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userContent }]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                }
            };

            for (let attempt = 0; terutama <= retries; attempt++) {
                if (state.abortController && state.abortController.signal.aborted) {
                    throw new Error('使用者已取消');
                }

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: state.abortController ? state.abortController.signal : undefined
                    });

                    if (response.status === 429 && attempt < retries) {
                        await new Promise(res => setTimeout(res, delay * Math.pow(2, attempt)));
                        continue;
                    }

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `API 請求失敗 (狀態碼: ${response.status})`);
                    }

                    const data = await response.json();
                    const candidate = data.candidates?.[0];
                    if (!candidate || !candidate.content?.parts?.[0]?.text) {
                        throw new Error('API 回傳格式異常或內容被安全策略攔截。');
                    }

                    return candidate.content.parts[0].text;
                } catch (err) {
                    if (attempt === retries || err.name === 'AbortError') throw err;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        // Stage A: Structured Executive Summary
        async function generateExecutiveSummary(fullText) {
            setStatus('正在生成結構化重點摘要...', '摘要生成中', true);
            progressBar.style.width = '35%';

            // Prioritize first ~25,000 characters (Abstract, Intro, Methods, Results, Conclusion)
            const sampleText = fullText.slice(0, 25000);

            const systemPrompt = `你是一位頂尖的學術論文分析專家。請閱讀以下學術論文內容，並以精確、嚴謹的【繁體中文】回傳結構化摘要。
必須嚴格使用以下 5 個 Markdown 標題進行排版：
### 🎯 一句話核心貢獻 (Core Contribution)
### 🔍 研究背景與痛點 (Background & Problem Statement)
### ⚙️ 核心方法與實驗設計 (Methodology & Experimental Design)
### 📊 關鍵數據與實驗結果 (Key Findings & Results)
### ⚠️ 研究限制與未來方向 (Limitations & Future Work)

請確保數學公式採用 KaTeX 格式（例如 $...$ 或 $$...$$），專有名詞附上英文原名（如：注意力機制 (Attention Mechanism)）。`;

            const summaryMarkdown = await callGeminiAPI(systemPrompt, `請分析以下學術論文並提供結構化摘要：\n\n${sampleText}`);

            summaryContent.innerHTML = marked.parse(summaryMarkdown);
            renderMathInElement(summaryContent, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        // Stage B: Sequential Full Translation Pipeline
        async function processFullTranslation() {
            const totalChunks = state.extractedChunks.length;
            state.translationResults = [];

            for (let i = 0; i < totalChunks; i++) {
                if (state.abortController && state.abortController.signal.aborted) break;

                const progressPct = 40 + Math.round(((i + 1) / totalChunks) * 60);
                progressBar.style.width = `${progressPct}%`;
                setStatus(`正在翻譯第 ${i + 1} / ${totalChunks} 個區段...`, '翻譯中', true);

                const chunkText = state.extractedChunks[i];

                const systemPrompt = `你是一位專業的學術文獻翻譯家。請將以下英文論文段落翻譯成自然、嚴謹的【繁體中文】學術語體。
【翻譯規範】：
1. 保持段落結構，確保雙語段落可以 1 對 1 對應。若來源包含多個段落（以 \\n\\n 分隔），請在翻譯中同樣使用 \\n\\n 分隔出相同數量的段落。
2. 專有名詞規則：當領域專業術語、演算法或縮寫首次出現時，務必在括號內附上英文原名，例如：注意力機制 (Attention Mechanism)。
3. 數學與引用：所有數學變數、方程式（保留 LaTeX 格式如 $...$ 或 $$...$$）、化學式與文獻引用（如 [12]、(Smith et al., 2023)）皆須完整保留，切勿翻譯符號。
4. 請以 JSON 格式回傳，結構如下：
{
  "paragraphs": [
    "第一段繁體中文翻譯...",
    "第二段繁體中文翻譯..."
  ]
}`;

                try {
                    const jsonString = await callGeminiAPI(systemPrompt, `請翻譯以下論文段落：\n\n${chunkText}`);
                    
                    // Clean JSON output if wrapped in markdown code blocks
                    let cleanJsonStr = jsonString.trim();
                    if (cleanJsonStr.startsWith('```json')) {
                        cleanJsonStr = cleanJsonStr.replace(/^```json/, '').replace(/```$/, '').trim();
                    } else if (cleanJsonStr.startsWith('```')) {
                        cleanJsonStr = cleanJsonStr.replace(/^```/, '').replace(/```$/, '').trim();
                    }

                    const parsed = JSON.parse(cleanJsonStr);
                    const translatedParagraphs = parsed.paragraphs || [jsonString];

                    state.translationResults.push({
                        original: chunkText,
                        translation: translatedParagraphs
                    });

                    // Progressive render update
                    renderTranslationUI();

                } catch (err) {
                    console.error(`Chunk ${i+1} translation error:`, err);
                    // Fallback storage if json parse failed
                    state.translationResults.push({
                        original: chunkText,
                        translation: [err.message === '使用者已取消' ? '已取消' : '（此區段翻譯解析失敗）']
                    });
                    renderTranslationUI();
                }

                // Rate limit delay between chunk requests
                if (i < totalChunks - 1) {
                    await new Promise(res => setTimeout(res, 500));
                }
            }

            progressContainer.classList.add('hidden');
            setStatus('論文解析與翻譯完成', '完成', false);
        }

        // Render Translation UI based on current viewMode
        function renderTranslationUI() {
            translationContainer.innerHTML = '';

            state.translationResults.forEach((item, index) => {
                const chunkWrapper = document.createElement('div');
                chunkWrapper.className = 'bg-[#121212] border border-borderColor rounded-xl p-4 md:p-5 space-y-4 shadow';

                const headerEl = document.createElement('div');
                headerEl.className = 'flex items-center justify-between text-xs text-zinc-500 pb-2 border-b border-borderColor/50';
                headerEl.innerHTML = `<span>區段 #${index + 1}</span>`;
                chunkWrapper.appendChild(headerEl);

                if (state.viewMode === 'mono') {
                    // Mode A: Traditional Chinese Only
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'space-y-3 text-zinc-200 leading-relaxed';
                    const transParas = Array.isArray(item.translation) ? item.translation : [item.translation];
                    
                    transParas.forEach(p => {
                        const pEl = document.createElement('p');
                        pEl.innerHTML = marked.parseInline(p);
                        contentDiv.appendChild(pEl);
                    });
                    chunkWrapper.appendChild(contentDiv);

                } else {
                    // Mode B: Bilingual Side-by-Side / Paragraph-by-Paragraph
                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 items-start';

                    // Original English Column
                    const origCol = document.createElement('div');
                    origCol.className = 'bg-[#18181B] p-3.5 rounded-lg border border-borderColor/60 text-zinc-400 text-xs md:text-sm space-y-2';
                    const origTitle = document.createElement('div');
                    origTitle.className = 'font-semibold text-zinc-400 text-xs mb-1 uppercase tracking-wider';
                    origTitle.textContent = 'Original (English)';
                    origCol.appendChild(origTitle);

                    const origParas = item.original.split(/\n\s*\n/);
                    origParas.forEach(p => {
                        const pEl = document.createElement('p');
                        pEl.textContent = p;
                        origCol.appendChild(pEl);
                    });

                    // Translated Chinese Column
                    const transCol = document.createElement('div');
                    transCol.className = 'bg-[#1E1E1E] p-3.5 rounded-lg border border-accent/20 text-zinc-200 text-xs md:text-sm space-y-2';
                    const transTitle = document.createElement('div');
                    transTitle.className = 'font-semibold text-accent text-xs mb-1 uppercase tracking-wider';
                    transTitle.textContent = '繁體中文翻譯';
                    transCol.appendChild(transTitle);

                    const transParas = Array.isArray(item.translation) ? item.translation : [item.translation];
                    transParas.forEach(p => {
                        const pEl = document.createElement('p');
                        pEl.innerHTML = marked.parseInline(p);
                        transCol.appendChild(pEl);
                    });

                    gridDiv.appendChild(origCol);
                    gridDiv.appendChild(transCol);
                    chunkWrapper.appendChild(gridDiv);
                }

                translationContainer.appendChild(chunkWrapper);
            });

            // Post-render Math Processing via KaTeX
            renderMathInElement(translationContainer, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }
    </script>
</body>
